name: Modernization migration

on:
  push:
    branches:
      - chore/modernize-tooling

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/modernize-tooling
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --ignore-scripts
      - name: Fix strict TypeScript findings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let model = fs.readFileSync('src/model.ts', 'utf8');
          model = model.replace('    validator?: (data: unknown) => boolean;', '    validator: ((data: unknown) => boolean) | undefined;');
          fs.writeFileSync('src/model.ts', model);
          let utilities = fs.readFileSync('src/utilities.ts', 'utf8');
          utilities = utilities.replace(
            /            let i;\n            for \(i = 0; i < messages\.length; i\+\+\) \{\n                this\.emit\(messages\[i\], data\);\n                if \(this\.name && this\.mediator && this\.mediator\.emit\) \{\n                    this\.mediator\.emit\(this\.label \+ ':' \+ this\.name \+ ':' \+ messages\[i\], data\);\n                \}\n            \}/,
            `            for (const message of messages) {\n                this.emit(message, data);\n                if (this.name && this.mediator && this.mediator.emit) {\n                    this.mediator.emit(this.label + ':' + this.name + ':' + message, data);\n                }\n            }`,
          );
          fs.writeFileSync('src/utilities.ts', utilities);
          NODE
      - run: npm run lint:fix
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - run: rm .github/workflows/modernization-migration.yml
      - name: Commit generated metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Complete project modernization"
          git push
