name: Modernization migration

on:
  push:
    branches:
      - chore/modernize-tooling

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/modernize-tooling
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - run: rm .github/workflows/modernization-migration.yml
      - name: Commit generated metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Regenerate lockfile and verify modernization"
          git push
