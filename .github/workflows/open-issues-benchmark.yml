name: Open issues benchmark

on:
  push:
    branches:
      - future/address-open-issues

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run benchmark
      - name: Benchmark Model/View integration
        run: |
          npm install --no-save --ignore-scripts white-label-view@6.0.0 >/dev/null
          npm run build >/dev/null
          node <<'NODE'
          const {performance} = require('node:perf_hooks');
          const {Model} = require('./dist/index.js');
          const View = require('white-label-view/server');
          const rounds = 7;
          const iterations = 3000;
          function median(values) {
            return [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          }
          function run(batched) {
            const samples = [];
            let renders = 0;
            for (let round = 0; round < rounds; round += 1) {
              const model = new Model({count: 0, items: Array.from({length: 30}, (_, i) => ({id: i, label: `item-${i}`}))});
              const view = new View({model, template: state => {
                renders += 1;
                return `<section><h1>${state.count}</h1>${state.items.map(item => `<p>${item.id}:${item.label}</p>`).join('')}</section>`;
              }}).initialize();
              const start = performance.now();
              for (let iteration = 0; iteration < iterations; iteration += 1) {
                const mutate = () => {
                  for (let update = 0; update < 10; update += 1) model.update({count: update});
                };
                if (batched) model.batch(mutate); else mutate();
              }
              samples.push(performance.now() - start);
              view.destroy();
            }
            return {milliseconds: Number(median(samples).toFixed(2)), renders};
          }
          const unbatched = run(false);
          const batched = run(true);
          console.table([
            {mode: 'unbatched', iterations, milliseconds: unbatched.milliseconds, renders: unbatched.renders},
            {mode: 'batched', iterations, milliseconds: batched.milliseconds, renders: batched.renders}
          ]);
          console.log(`speedup=${(unbatched.milliseconds / batched.milliseconds).toFixed(2)}x`);
          NODE
      - name: Compare generated implementation size
        run: |
          npm run build >/dev/null
          CURRENT=$(wc -c < dist/model.js)
          git show origin/master:dist/model.js > /tmp/model-master.js
          BASE=$(wc -c < /tmp/model-master.js)
          echo "master_dist_model_bytes=$BASE"
          echo "branch_dist_model_bytes=$CURRENT"
          echo "delta_bytes=$((CURRENT - BASE))"
