name: Validate unified Model migration

on:
  push:
    branches:
      - feat/deep-change-tracking-20260912
    paths:
      - .github/workflows/unified-model-migration.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh repository guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          text = text.replace(
              'Observable object and array/Map collection state with mutation events and optional validation.',
              'One observable Model for plain-object, array, or Map state with mutation events and optional validation.'
          )
          text = text.replace(
              'Preserve mutation return values, silent-event semantics, full-state event payloads, and array/Map behavior. Model state is deeply observable through lazy proxies: keep nested change tracking path-based and do not introduce whole-model deep scans or diffs. Keep runtime validation separate from TypeScript types. Service hooks do not perform HTTP requests unless an application overrides them.',
              'Preserve the single public Model entry point, mutation return values, silent-event semantics, full-state event payloads, and object/array/Map behavior. Do not reintroduce a separate Collection class or compatibility alias. Model state is deeply observable through lazy proxies: keep nested change tracking path-based and do not introduce whole-model deep scans or diffs. Keep runtime validation separate from TypeScript types. Service hooks do not perform HTTP requests unless an application overrides them.'
          )
          agents.write_text(text)

          compatibility = Path('docs/events-compatibility.md')
          text = compatibility.read_text()
          text = text.replace(
              'The package-specific cases also cover lifecycle cleanup. Model/Collection cases cover mutation order, full-state payload identity, silent mutations, invalid Model updates, array/Map collections, and local/namespaced relay using each combination of the two event backends. State teardown must not unsubscribe unrelated mediator listeners.',
              'The package-specific cases also cover lifecycle cleanup. Unified Model cases cover mutation order, full-state payload identity, silent mutations, invalid updates, plain-object/array/Map roots, and local/namespaced relay using each combination of the two event backends. State teardown must not unsubscribe unrelated mediator listeners.'
          )
          compatibility.write_text(text)
          PY
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit documentation updates
        run: |
          git add AGENTS.md docs/events-compatibility.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Document unified Model repository contract"
          git push
