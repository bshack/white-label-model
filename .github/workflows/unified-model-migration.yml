name: Validate unified Model migration

on:
  push:
    branches:
      - feat/deep-change-tracking-20260912
    paths:
      - .github/workflows/unified-model-migration.yml
      - src/**
      - test/**
      - test-types/**
      - package.json

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Apply migration fixups
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/model.ts')
          text = path.read_text()
          text = text.replace('private isObservable(value: unknown): value is object {', 'private isObservable(value: unknown): value is ModelData {')
          text = text.replace('        let proxy: Map<unknown, unknown>;\n', '')
          text = text.replace('        proxy = new Proxy(value, {', '        const proxy = new Proxy(value, {')
          text = text.replace(
              "        if (!this.isSupportedData(initial)) {\n            throw new TypeError('Model data must be a plain object, array, or Map.');\n        }\n        this.modelData = this.observe(initial, []) as T;",
              "        if (!this.isSupportedData(initial)) {\n            throw new TypeError('Model data must be a plain object, array, or Map.');\n        }\n        if (!this.accepts(initial)) {\n            throw new TypeError('Initial model data failed validation.');\n        }\n        this.modelData = this.observe(initial, []) as T;"
          )
          text = text.replace(
              "            return this.set(candidate, dataOrSilent === true) &&\n                (dataOrSilent === true || this.message(['update'], this.get()));",
              "            if (!this.set(candidate, true)) {\n                return false;\n            }\n            if (dataOrSilent !== true) {\n                this.message(['change', 'update'], this.get());\n            }\n            return true;"
          )
          text = text.replace(
              "            const additions = Array.isArray(key) ? key.map(item => this.toRaw(item)) : [this.toRaw(key)];\n            const candidate = raw.concat(additions);",
              "            const additions: unknown[] = [];\n            if (Array.isArray(key)) {\n                for (let index = 0; index < key.length; index += 1) {\n                    additions.push(this.toRaw(key[index]));\n                }\n            } else {\n                additions.push(this.toRaw(key));\n            }\n            const candidate = raw.concat(additions);"
          )
          text = text.replace(
              "            additions.forEach(item => raw.push(item));",
              "            for (let index = 0; index < additions.length; index += 1) {\n                raw.push(additions[index]);\n            }"
          )
          path.write_text(text)
          PY
          rm -f dist/collection.js dist/collection.js.map dist/collection.d.ts
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit generated artifacts
        run: |
          git add src/model.ts package-lock.json dist
          git add -u dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate unified Model artifacts"
          git push
