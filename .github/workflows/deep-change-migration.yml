name: Regenerate deep-change artifacts

on:
  push:
    branches:
      - feat/deep-change-tracking-20260912
    paths:
      - .github/workflows/deep-change-migration.yml
      - src/model.ts
      - test/deep-mutation.test.js
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Refresh documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          marker = '### Version 4 migration\n'
          version5 = '''### Version 5 migration\n\n`Model.get()` now returns a lazily observed `Proxy`. Direct assignments and property deletions at any nesting depth emit the existing full-state `change` event plus a new `mutate` event with `{operation, path, oldValue, newValue, state}`. Nested objects and arrays are wrapped only when accessed; mutations do not deep-scan or deep-diff unrelated model state. Because `get()` now returns an observable proxy rather than the original root object identity, this is a major release. `Collection` behavior is unchanged.\n\n'''
          if version5 not in text:
              text = text.replace(marker, version5 + marker)
          text = text.replace('| `get()` | Returns the stored object. | None |', '| `get()` | Returns a lazily observed proxy for the stored object. | Direct nested writes emit `change`, `mutate` |')
          old = '`update()` blocks the special keys `__proto__`, `constructor`, and `prototype` while merging. The merge is shallow; nested objects are replaced rather than recursively merged.\n'
          new = old + '''\nDirect writes through `get()` are observed at arbitrary practical depth without recursively scanning the model. Plain objects and arrays are proxied lazily as each branch is accessed. Every changed property emits one `change` event with the complete current state and one `mutate` event with the exact property path. Assigning the same value is ignored. Array methods are observed through the property operations they perform. Direct writes to `__proto__`, `constructor`, and `prototype` are rejected.\n\n```js\nprofile.get().preferences = {theme: 'light'};\nprofile.get().preferences.theme = 'dark';\n\nprofile.on('mutate', ({operation, path, oldValue, newValue}) => {\n    console.log(operation, path, oldValue, newValue);\n});\n```\n\nThe observation cost follows the accessed path rather than total model size. CI includes a large-unrelated-state regression test so a nested write cannot silently turn into a whole-model scan.\n'''
          text = text.replace(old, new)
          text = text.replace('The object returned by `get()` is the stored object, array, or `Map`, not a defensive copy. Treat it as read-only and use mutation methods when you want events to be emitted.', '`Model.get()` returns a live observable proxy, so direct assignments and deletes emit events. `Collection.get()` still returns the stored array or `Map` rather than a defensive copy; use Collection mutation methods when you want collection events.')
          event_marker = 'All listeners receive the complete current model or collection data.\n'
          event_extra = '''All listeners receive the complete current model or collection data.\n\nFor direct Model property changes, `change` keeps that full-state payload and `mutate` receives path-specific details:\n\n```js\nprofile.on('mutate', ({operation, path, oldValue, newValue, state}) => {\n    // path is an array of property keys, for example ['user', 'profile', 'name'].\n});\n```\n'''
          text = text.replace(event_marker, event_extra)
          validation = 'The validator runs for construction, `set()`, and merged `update()` data. Invalid mutations return `false` and leave existing state unchanged.\n'
          validation_new = validation + '\nDirect assignments through the observable object returned by `get()` do not invoke the optional validator; use `set()` or `update()` when a mutation must pass whole-model runtime validation.\n'
          text = text.replace(validation, validation_new)
          readme.write_text(text)

          agents = Path('AGENTS.md')
          text = agents.read_text()
          old = 'Preserve mutation return values, silent-event semantics, full-state event payloads, and array/Map behavior. Keep runtime validation separate from TypeScript types. Service hooks do not perform HTTP requests unless an application overrides them.'
          new = 'Preserve mutation return values, silent-event semantics, full-state event payloads, and array/Map behavior. Model state is deeply observable through lazy proxies: keep nested change tracking path-based and do not introduce whole-model deep scans or diffs. Keep runtime validation separate from TypeScript types. Service hooks do not perform HTTP requests unless an application overrides them.'
          text = text.replace(old, new)
          agents.write_text(text)
          PY
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit generated and documentation changes
        run: |
          git add package-lock.json dist README.md AGENTS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate deep-change artifacts"
          git push
